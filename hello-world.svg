<svg width="600" height="70" viewBox="0 0 600 70"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 24px;
      font-weight: 400;
      fill: #57606a;
      letter-spacing: 0.5px;
    }

    .prompt {
      fill: #2da44e;
    }

    .cursor {
      animation: blink 1.1s steps(1) infinite;
    }

    @media (prefers-color-scheme: dark) {
      .text {
        fill: #8c959f;
      }

      .prompt {
        fill: #3fb950;
      }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <text x="170" y="43" class="text">
    <tspan class="prompt">&gt;</tspan>
    <tspan> hello, world</tspan>
    <tspan class="cursor">_</tspan>
  </text>

</svg>
