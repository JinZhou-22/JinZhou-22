<svg width="900" height="120" viewBox="0 0 900 120"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 44px;
      font-weight: 500;
      fill: #24292f;
    }

    .prompt {
      fill: #2da44e;
    }

    .cursor {
      fill: #2da44e;
      animation: blink 1s steps(1) infinite;
    }

    @media (prefers-color-scheme: dark) {
      .text {
        fill: #f0f6fc;
      }

      .prompt,
      .cursor {
        fill: #3fb950;
      }
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }
  </style>

  <g transform="translate(250, 75)">
    
    <text class="text prompt" x="0" y="0">&gt;</text>

    <text class="text" x="42" y="0">
      Hello, World!
    </text>

    <rect class="cursor"
          x="380"
          y="-36"
          width="5"
          height="43"
          rx="1"/>
          
  </g>

</svg>
